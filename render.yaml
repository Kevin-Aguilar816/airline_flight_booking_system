# Render "Blueprint": one click creates the web app + a PostgreSQL database.
services:
  - type: web
    name: flight-in-flight-out
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false        # you type this in the Render dashboard
databases:
  - name: flight-db
    plan: free
