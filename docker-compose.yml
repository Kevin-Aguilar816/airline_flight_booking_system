# One command deploy:  docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: skybook
      POSTGRES_PASSWORD: skybook
      POSTGRES_DB: skybook
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybook"]
      interval: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://skybook:skybook@db:5432/skybook
      SECRET_KEY: change-me-in-production
      HOLD_MINUTES: "10"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
